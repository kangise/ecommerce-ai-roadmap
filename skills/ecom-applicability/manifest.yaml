description: Determine whether AI is appropriate for a specific e-commerce task —
  answers 'should I use AI for X?' with boundary-aware reasoning
inputs:
- description: The e-commerce task being considered for AI automation
  name: task
  required: true
  type: string
- description: What data is available (volume, quality, accessibility)
  name: data_availability
  required: false
  type: string
- description: Acceptable risk level for this task
  name: risk_tolerance
  required: false
  type: string
name: ecom-applicability
outputs:
- description: Decision (yes/no/maybe), prerequisites, boundary conditions that apply,
    next steps
  name: applicability_assessment
  type: object
platforms: []
triggers:
  intent: assess_applicability | check_readiness | evaluate_ai_fit
