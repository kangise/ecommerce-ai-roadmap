description: Handle customer service and after-sales — negative review responses,
  complaint handling, Plan of Action appeals, refund and return inquiries, multilingual
  buyer replies, review-request emails, FAQ generation, and CS KPI tracking
inputs:
- description: Buyer message, negative review text, or complaint text to respond to
  name: customer_message
  required: true
  type: object
- description: Reviews (positive and negative, 1-5 stars) for analysis
  name: review_data
  required: false
  type: array
- description: Product name and description for reply context
  name: product_info
  required: false
  type: object
- default: amazon
  description: Marketplace where the customer contact happens
  name: platform
  type: enum
  values:
  - amazon
  - shopify
  - tiktok_shop
- description: Target market (US, DE, JP, ES, MX, BR, etc.)
  name: market
  required: false
  type: string
- description: Order details for refund/return/shipping inquiries
  name: order_info
  required: false
  type: object
- description: Platform notice text (violation, IP complaint, suspension) for appeals
  name: complaint_notice
  required: false
  type: string
- description: Return reason data (reason, count, share) for return analysis
  name: return_report
  required: false
  type: object
name: ecom-customer-service
outputs:
- description: Multilingual reply templates for buyer messages
  name: reply_draft
  type: object
- description: Public reply for a negative review
  name: public_response
  type: string
- description: 'Appeal letter: Root Cause / Immediate Actions / Preventive Measures'
  name: plan_of_action
  type: object
- description: Policy-compliant review request email (3 versions)
  name: review_request_email
  type: object
- description: Product FAQ generated from customer messages and reviews
  name: faq
  type: array
- description: Return cause classification and improvement suggestions
  name: return_analysis
  type: object
- description: Review sentiment distribution and trend report
  name: sentiment_report
  type: object
- description: CS KPI design, tracking template, and monthly report structure
  name: kpi_system
  type: object
platforms:
- amazon
- shopify
- tiktok_shop
triggers:
  intent: reply_to_customer | respond_review | draft_appeal | analyze_returns | generate_faq
    | localize_reply | design_cs_kpi | monitor_sentiment
  keywords:
  - FAQ
  - POA
  - Plan of Action
  - appeal
  - complaint
  - customer
  - feedback
  - message
  - negative review
  - refund
  - response
  - return
  - review
  - 一星
  - 买家
  - 买家消息
  - 买家说
  - 发货
  - 售后
  - 回复
  - 好评
  - 客服
  - 客诉
  - 差评
  - 投诉
  - 挽回
  - 物流慢
  - 物流查询
  - 申诉
  - 自动回复
  - 评价
  - 退换货
  - 退款
  - 退货
  - 邮件
uses_constraints:
- amazon.listing.forbidden_unverified_claim
- amazon.safety_complaint.response_deadline
- amazon.violation.response_deadline
- content.ai_generated.commercial_license
uses_entities:
- brand_registry
- buy_box
- cac
- compliance_check
- ltv
- qa
- rating
- review
- seller_central
- shipment
