description: Research products, analyze markets, evaluate competitors, and identify
  product opportunities
inputs:
- description: Product category to research
  name: category
  required: true
  type: string
- description: Target market (US, EU, etc.)
  name: market
  required: false
  type: string
- description: 'Selection criteria: price range, margin floor, demand threshold'
  name: criteria
  required: false
  type: object
name: ecom-research
outputs:
- description: Market overview, competitor landscape, product opportunities, risk
    assessment
  name: research_report
  type: object
platforms:
- amazon
- shopify
triggers:
  intent: research_product | analyze_market | evaluate_competitor | find_opportunity
  keywords:
  - competitor
  - market analysis
  - opportunity
  - product research
  - sourcing
  - 一天出三百单
  - 三百单
  - 上了个新
  - 下滑
  - 供应商
  - 入场
