uses_constraints:
- amazon.bullet_point.no_html
- amazon.keyword.value.min_clicks_statistics
- content.ai_generated.commercial_license
- forecast.backtest_target
- forecast.changepoint_prior_range
- forecast.interval_usage
- forecast.metric_mape_baseline
- forecast.stockout_data_handling
- inventory.promo_sales_multiplier
uses_entities:
- product_category_approval
- product_feed
- product_image
- product_page
- product_video
- restricted_product
- sponsored_product
- supplier
- tiktok_product
