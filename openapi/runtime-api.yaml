    AdsCapabilityGateRequest:
      type: object
      additionalProperties: false
      required: [connector_account_id]
      properties:
        connector_account_id: {type: string, format: uuid}
        attestation_reference: {type: string, minLength: 3, maxLength: 256, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/#-]{2,255}$', nullable: true, description: Opaque external approval reference; secrets, query strings, and tokens are forbidden.}
    AdsCapabilityGate:
      type: object
      additionalProperties: false
      required: [id, tenant_id, connector_account_id, created_by, status, region, profile_id, required_capabilities, observed_capabilities, checks, request_ids, retry_after_seconds, attestation_reference, error_code, error_message, checked_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        connector_account_id: {type: string, format: uuid}
        created_by: {type: string, format: uuid}
        status: {type: string, enum: [checking, passed, blocked, failed]}
        region: {type: string, enum: [na, eu, fe]}
        profile_id: {type: string, pattern: '^[0-9]{1,32}$'}
        required_capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [lwa, profiles_read, campaigns_list_read, external_attestation]}
        observed_capabilities:
          type: array
          uniqueItems: true
          items: {type: string, enum: [lwa, profiles_read, campaigns_list_read, external_attestation]}
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, status]
            properties:
              name: {type: string, enum: [lwa, profiles_read, target_profile, campaigns_list_read, external_attestation]}
              status: {type: string, enum: [passed, blocked, failed, skipped]}
              detail: {type: string, maxLength: 1000}
        request_ids: {type: array, uniqueItems: true, maxItems: 16, items: {type: string, maxLength: 256}}
        retry_after_seconds: {type: integer, minimum: 1, maximum: 3600, nullable: true}
        attestation_reference: {type: string, nullable: true, maxLength: 256}
        error_code: {type: string, nullable: true, maxLength: 100}
        error_message: {type: string, nullable: true, maxLength: 1000}
        checked_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdsAdapterStatus:
      type: object
      additionalProperties: false
      required: [status, adapter_registered, write_operations, reason_codes, connector_account_id, gate_id, gate_checked_at, account_updated_at, profile_id, region, evaluated_at]
      properties:
        status: {type: string, enum: [blocked, eligible_not_installed]}
        adapter_registered: {type: boolean, enum: [false]}
        write_operations:
          type: array
          maxItems: 0
          items: {type: string}
        reason_codes:
          type: array
          minItems: 2
          uniqueItems: true
          items: {type: string, enum: [no_amazon_ads_account, no_capability_gate, gate_not_passed, required_capabilities_missing, gate_account_config_mismatch, gate_not_checked, gate_stale_account_changed, gate_expired, gate_checked_in_future, adapter_not_installed, write_surface_disabled]}
        connector_account_id: {type: string, format: uuid, nullable: true}
        gate_id: {type: string, format: uuid, nullable: true}
        gate_checked_at: {type: string, format: date-time, nullable: true}
        account_updated_at: {type: string, format: date-time, nullable: true}
        profile_id: {type: string, pattern: '^[0-9]{1,32}$', nullable: true}
        region: {type: string, enum: [na, eu, fe], nullable: true}
        evaluated_at: {type: string, format: date-time}
    ActionRequest:
      oneOf:
        - {$ref: '#/components/schemas/ShopifySyncActionRequest'}
        - {$ref: '#/components/schemas/AmazonReportImportActionRequest'}
      discriminator:
        propertyName: operation
    ShopifySyncActionRequest:
      type: object
      additionalProperties: false
      required: [operation, payload]
      properties:
        operation: {type: string, enum: [shopify.sync_products]}
        payload:
