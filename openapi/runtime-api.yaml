openapi: 3.0.3
info:
  title: E-commerce AI Runtime API
  version: 1.2.0
  description: Tenant-scoped users, persistence, approval, audit, and connector boundary.
servers:
  - url: http://127.0.0.1:8787
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Check process liveness
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /readyz:
    get:
      summary: Check database and schema readiness
      security: []
      responses:
        '200':
          description: Database schema ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
        '503':
          description: Database not ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
  /v1/demo-session:
    get:
      summary: Bootstrap the loopback-only explicit Demo UI session
      description: Available only when the separate `demo` CLI starts a database containing exactly one Demo tenant. Normal Runtime API processes return 404.
      security: []
      responses:
        '200':
          description: Temporary Demo key kept in page memory and revoked when the Demo server stops
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemoSession'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/me:
    get:
      summary: Read the authenticated principal
      responses:
        '200':
          description: Authenticated principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Principal'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/users:
    get:
      summary: List users owned by the authenticated tenant
      responses:
        '200':
          description: Tenant users without API-key material
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a tenant user
      description: Admins may assign roles up to admin; only an owner may assign owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreate'}
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/users/{userId}:
    patch:
      summary: Change a tenant user's role
      description: Self-role changes and last-owner demotion are rejected.
      parameters:
        - {$ref: '#/components/parameters/userId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserRoleUpdate'}
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/api-keys:
    get:
      summary: List tenant API-key metadata
      responses:
        '200':
          description: Key metadata without secrets or hashes
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: {$ref: '#/components/schemas/ApiKeyMetadata'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Issue a one-time API key for a tenant user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: {type: string, format: uuid}
      responses:
        '201':
          description: One-time API key; the clear value is never returned again
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyIssued'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/api-keys/rotate:
    post:
      summary: Rotate the current caller's API key
      responses:
        '200':
          description: Replacement one-time API key
          content:
            application/json:
              schema:
                type: object
                required: [api_key]
                properties:
                  api_key: {type: string, writeOnly: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/api-keys/{keyId}/revoke:
    post:
      summary: Revoke a tenant API key
      parameters:
        - {$ref: '#/components/parameters/keyId'}
      responses:
        '200':
          description: Key revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked, key_id]
                properties:
                  revoked: {type: boolean, enum: [true]}
                  key_id: {type: string, format: uuid}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/connectors:
    get:
      summary: List tenant-owned marketplace connector accounts
      description: Viewer, operator, admin, and owner roles may read the safe connector representation for their authenticated tenant. Credential values and environment-variable names are never returned.
      responses:
        '200':
          description: Connector accounts with redacted credential references
          content:
            application/json:
              schema:
                type: object
                required: [connectors]
                properties:
                  connectors:
                    type: array
                    items: {$ref: '#/components/schemas/MarketplaceAccount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a tenant marketplace connector account
      description: Requires admin or owner role. The request stores only non-secret connector details and environment-variable references; the response redacts those references to a present marker.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectorRegistration'}
      responses:
        '201':
          description: Connector account created with initial unchecked health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketplaceAccount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/connectors/{accountId}:
    get:
      summary: Read one tenant marketplace connector account
      description: Viewer, operator, admin, and owner roles may read the safe connector representation. An account outside the authenticated tenant is indistinguishable from a missing account and returns 404.
      parameters:
        - {$ref: '#/components/parameters/accountId'}
      responses:
        '200':
          description: Connector account with redacted credential references
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketplaceAccount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Update a tenant marketplace connector account
      description: Requires admin or owner role. The existing provider is retained; config is required and must contain the complete provider configuration. external_account_id is optional and omitted values retain the existing identifier. Updating config resets health to unchecked and clears the persisted health error.
      parameters:
        - {$ref: '#/components/parameters/accountId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectorUpdateRequest'}
      responses:
        '200':
          description: Updated connector account with health reset to unchecked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketplaceAccount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/connectors/{accountId}/health-check:
    post:
      summary: Run and persist a connector health check
      description: "Requires operator, admin, or owner role. The check is synchronous and provider-specific: Amazon SP-API verifies Sellers marketplaceParticipations, Amazon Ads verifies the configured profile through the regional v2 profiles endpoint without reading campaigns, and Shopify reads shop.json. A failed remote check is persisted on the account and returned as a 200 response with health_status, health_error_code, and health_error_message; it is not converted into a transient success."
      parameters:
        - {$ref: '#/components/parameters/accountId'}
      responses:
        '200':
          description: Connector account after the persisted health result; health_status may be healthy, unhealthy, or misconfigured
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketplaceAccount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/report-recipes:
    get:
      summary: List tenant-owned Amazon report recipes
      description: Viewer, operator, admin, and owner roles may read persisted report recipes for their authenticated tenant. Listing recipes never calls Amazon.
      responses:
        '200':
          description: Persisted report recipes
          content:
            application/json:
              schema:
                type: object
                required: [report_recipes]
                properties:
                  report_recipes:
                    type: array
                    items: {$ref: '#/components/schemas/ReportRecipe'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Persist an Amazon report recipe
      description: Requires operator or owner role. This L2 operation validates and persists configuration only; it does not call Amazon, enqueue work, or create a report. connector_account_id must reference an Amazon SP-API account in the authenticated tenant, and marketplace_ids must be a subset of that account's configured marketplaces.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportRecipeCreate'}
      responses:
        '201':
          description: Persisted report recipe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportRecipe'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/report-recipes/{recipeId}:
    get:
      summary: Read one tenant-owned Amazon report recipe
      description: Viewer, operator, admin, and owner roles may read a persisted recipe. A recipe outside the authenticated tenant returns 404.
      parameters:
        - {$ref: '#/components/parameters/recipeId'}
      responses:
        '200':
          description: Persisted report recipe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportRecipe'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Update a tenant-owned Amazon report recipe
      description: Requires operator or owner role. All recipe fields except connector_account_id are required on update; the connector account cannot be changed. The update persists configuration only and never calls Amazon. marketplace_ids must remain a subset of the linked account's configured marketplaces.
      parameters:
        - {$ref: '#/components/parameters/recipeId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportRecipeUpdate'}
      responses:
        '200':
          description: Updated persisted report recipe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportRecipe'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/report-recipes/{recipeId}/sync:
    post:
      summary: Enqueue an idempotent Amazon report synchronization
      description: Requires operator or higher and an Idempotency-Key. The linked Amazon account and recipe must be enabled and healthy. A durable L3 worker performs the official createReport call, then getReport polling through IN_QUEUE, IN_PROGRESS, DONE, CANCELLED, or FATAL, document retrieval, bounded normalization, and Evidence import asynchronously. HTTP 429 responses preserve Retry-After and use bounded retry/backoff; L3 never writes to Amazon and does not automatically schedule enabled recipes.
      parameters:
        - {$ref: '#/components/parameters/recipeId'}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        '202':
          description: Durable queued or replayed report sync
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportSync'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/report-syncs:
    get:
      summary: List tenant-owned Amazon report syncs
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Durable report synchronization states
          content:
            application/json:
              schema:
                type: object
                required: [report_syncs]
                properties:
                  report_syncs:
                    type: array
                    items: {$ref: '#/components/schemas/ReportSync'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/report-syncs/{syncId}:
    get:
      summary: Read one tenant-owned Amazon report sync
      parameters:
        - {$ref: '#/components/parameters/syncId'}
      responses:
        '200':
          description: Durable report synchronization state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportSync'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/ads-capability-gates:
    get:
      summary: List tenant-owned Amazon Ads capability gates
      description: Viewer, operator, admin, and owner roles may inspect persisted Ads admission checks. The route never probes Amazon.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Persisted Ads capability gates
          content:
            application/json:
              schema:
                type: object
                required: [ads_capability_gates]
                properties:
                  ads_capability_gates:
                    type: array
                    items: {$ref: '#/components/schemas/AdsCapabilityGate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Run a read-only Amazon Ads capability gate
      description: Requires admin or owner role and Idempotency-Key. The request performs only live probes and records an optional external attestation reference; it never creates or mutates an Ads resource.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdsCapabilityGateRequest'}
      responses:
        '201':
          description: Persisted terminal gate result, or a replayed checking result held by another request lease
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdsCapabilityGate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/ConnectorFailed'}
  /v1/ads-capability-gates/{gateId}:
    get:
      summary: Read one tenant-owned Amazon Ads capability gate
      parameters:
        - {$ref: '#/components/parameters/gateId'}
      responses:
        '200':
          description: Persisted Ads capability gate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdsCapabilityGate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/ads-adapter-status:
    get:
      summary: Read the conditional Amazon Ads adapter status
      description: Viewer-readable negative gate. This build does not register Ads write adapters, routes, or actions. `eligible_not_installed` is the only non-blocked fixture outcome permitted until a future release satisfies the L5 gate and approval safeguards.
      parameters:
        - in: query
          name: connector_account_id
          required: false
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Tenant-scoped adapter status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdsAdapterStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/actions:
    post:
      summary: Request an idempotent action
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActionRequest'}
      responses:
        '200':
          description: Existing idempotent action or newly requested action
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Action'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/actions/{actionId}/approve:
    post:
      summary: Approve a requested action as a second actor
      parameters:
        - {$ref: '#/components/parameters/actionId'}
      responses:
        '200':
          description: Approved action
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Action'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/actions/{actionId}/execute:
    post:
      summary: Execute an approved action
      parameters:
        - {$ref: '#/components/parameters/actionId'}
      responses:
        '200':
          description: Executed action
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Action'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/ConnectorFailed'}
  /v1/actions/{actionId}/retry:
    post:
      summary: Re-queue a failed or expired execution without bypassing approval
      parameters:
        - {$ref: '#/components/parameters/actionId'}
      responses:
        '200':
          description: Action returned to approved state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Action'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/evidence-imports:
    get:
      summary: List tenant-owned CSV evidence imports
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Import metadata without stored rows
          content:
            application/json:
              schema:
                type: object
                required: [imports]
                properties:
                  imports:
                    type: array
                    items: {$ref: '#/components/schemas/EvidenceImport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Parse and persist real marketplace CSV evidence
      description: Amazon typed reports receive semantic column validation; platform_generic accepts any ontology marketplace.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, maxLength: 200}
        - in: header
          name: X-Evidence-Platform
          required: true
          schema: {$ref: '#/components/schemas/MarketplaceId'}
        - in: header
          name: X-Evidence-Type
          required: true
          schema: {$ref: '#/components/schemas/EvidenceReportType'}
        - in: header
          name: X-Evidence-Filename
          required: true
          schema: {type: string, maxLength: 200}
        - in: header
          name: X-Evidence-Observed-At
          required: true
          schema: {type: string, format: date-time}
        - in: header
          name: X-Evidence-Sheet
          required: false
          description: Optional worksheet name for XLSX; defaults to the active sheet.
          schema: {type: string}
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, format: binary}
          text/tab-separated-values:
            schema: {type: string, format: binary}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Persisted evidence-import metadata; parsed rows remain server-side
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceImport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/evidence-imports/{importId}:
    get:
      summary: Read tenant-owned evidence-import metadata
      parameters:
        - {$ref: '#/components/parameters/importId'}
      responses:
        '200':
          description: Evidence-import metadata without stored rows
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceImport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/evidence-imports/{importId}/metric-materialization:
    post:
      summary: Materialize durable metric observations from one tenant-owned Evidence import
      description: Requires operator or higher and an Idempotency-Key. The Evidence import is resolved inside the authenticated tenant. Recognized finite decimal values are persisted with period, grain, provenance, and quality metadata. Monetary rows without an explicit ISO 4217 currency are quarantined and never emitted as observations. A failed materialization remains independently inspectable and never rolls back an already successful L3 Evidence import or report sync.
      parameters:
        - {$ref: '#/components/parameters/importId'}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Newly persisted or idempotently replayed materialization
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetricMaterialization'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/metric-observations:
    get:
      summary: List persisted metric observations owned by the authenticated tenant
      description: Viewer access. Results remain currency-isolated; the API does not aggregate or convert monetary observations across currencies.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
        - in: query
          name: cursor
          schema: {type: string, maxLength: 200}
        - in: query
          name: evidence_import_id
          schema: {type: string, format: uuid}
        - in: query
          name: platform
          schema: {$ref: '#/components/schemas/MarketplaceId'}
        - in: query
          name: metric_key
          schema: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,79}$'}
        - in: query
          name: currency
          description: Uppercase ISO 4217 currency code. Omit only when querying non-monetary observations.
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
            enum: [AED, AUD, BRL, CAD, EGP, EUR, GBP, INR, JPY, MXN, PLN, SAR, SEK, SGD, TRY, USD]
      responses:
        '200':
          description: Stable cursor page of tenant-owned observations
          content:
            application/json:
              schema:
                type: object
                required: [observations, next_cursor]
                properties:
                  observations:
                    type: array
                    items: {$ref: '#/components/schemas/MetricObservation'}
                  next_cursor: {type: string, nullable: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/metric-observations/{observationId}:
    get:
      summary: Read one persisted metric observation owned by the authenticated tenant
      parameters:
        - {$ref: '#/components/parameters/observationId'}
      responses:
        '200':
          description: Tenant-owned metric observation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetricObservation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/metric-materializations:
    get:
      summary: List persisted metric materialization attempts owned by the authenticated tenant
      description: Viewer access. Successful, partial, quarantined, and failed attempts remain durable and visible after refresh.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
        - in: query
          name: cursor
          schema: {type: string, maxLength: 200}
        - in: query
          name: evidence_import_id
          schema: {type: string, format: uuid}
        - in: query
          name: status
          schema: {type: string, enum: [running, succeeded, partial, quarantined, failed]}
      responses:
        '200':
          description: Stable cursor page of materialization attempts
          content:
            application/json:
              schema:
                type: object
                required: [materializations, next_cursor]
                properties:
                  materializations:
                    type: array
                    items: {$ref: '#/components/schemas/MetricMaterialization'}
                  next_cursor: {type: string, nullable: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/metric-materializations/backfill:
    post:
      summary: Materialize a bounded page of existing tenant Evidence imports
      description: Requires admin or owner. Backfill is always explicit, bounded to at most 100 imports per call, and cursor-resumable; it never fabricates Evidence or silently scans every tenant import.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MetricBackfillRequest'}
      responses:
        '200':
          description: Persisted materialization results for the processed page
          content:
            application/json:
              schema:
                type: object
                required: [materializations, processed, next_cursor]
                properties:
                  materializations:
                    type: array
                    maxItems: 100
                    items: {$ref: '#/components/schemas/MetricMaterialization'}
                  processed: {type: integer, minimum: 0, maximum: 100}
                  next_cursor: {type: string, nullable: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/agent-runs:
    get:
      summary: List tenant-owned multi-agent workflow runs
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Agent-run summaries; evidence bodies are omitted
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: {$ref: '#/components/schemas/AgentRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create an idempotent Weekly Ops Council run
      description: Persists user-supplied real evidence but does not call a model until execute.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentRunRequest'}
      responses:
        '200':
          description: Existing idempotent run or newly requested run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/agent-runs/{runId}:
    get:
      summary: Read a tenant-owned run with tasks, artifacts, and events
      parameters:
        - {$ref: '#/components/parameters/runId'}
      responses:
        '200':
          description: Complete durable workflow state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRunBundle'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/agent-runs/{runId}/events:
    get:
      summary: Read an incremental event page for a run
      parameters:
        - {$ref: '#/components/parameters/runId'}
        - in: query
          name: after
          schema: {type: string, pattern: '^[0-9]+$'}
          description: SQLite event sequence cursor returned as next_cursor
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Tenant-scoped event page
          content:
            application/json:
              schema:
                type: object
                required: [events, next_cursor]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/AgentEvent'}
                  next_cursor: {type: string, nullable: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/agent-runs/{runId}/execute:
    post:
      summary: Run three specialists in parallel and synthesize their findings
      description: Requires OPENAI_API_KEY and EAI_OPENAI_MODEL in the server environment.
      parameters:
        - {$ref: '#/components/parameters/runId'}
      responses:
        '200':
          description: Completed run, or the existing result for an already completed run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRunBundle'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/ConnectorFailed'}
  /v1/agent-runs/{runId}/evaluate:
    post:
      summary: Evaluate a completed Weekly Ops run with deterministic graders
      parameters:
        - {$ref: '#/components/parameters/runId'}
      responses:
        '200':
          description: Persisted workflow evaluation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentEvaluation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/agent-runs/{runId}/evaluations:
    get:
      summary: List persisted evaluations for a run
      parameters:
        - {$ref: '#/components/parameters/runId'}
      responses:
        '200':
          description: Workflow evaluations
          content:
            application/json:
              schema:
                type: object
                required: [evaluations]
                properties:
                  evaluations:
                    type: array
                    items: {$ref: '#/components/schemas/AgentEvaluation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/jobs:
    get:
      summary: List tenant-owned durable jobs
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Durable jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: {type: array, items: {$ref: '#/components/schemas/Job'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Enqueue an agent run for background execution
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobRequest'}
      responses:
        '200':
          description: Existing or new durable job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/jobs/{jobId}:
    get:
      summary: Read one tenant-owned durable job
      parameters:
        - {$ref: '#/components/parameters/jobId'}
      responses:
        '200':
          description: Durable job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/schedules:
    get:
      summary: List tenant-owned interval schedules
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules: {type: array, items: {$ref: '#/components/schemas/Schedule'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Schedule repeated Weekly Ops runs
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleCreate'}
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/schedules/{scheduleId}:
    patch:
      summary: Enable or disable a schedule
      parameters:
        - {$ref: '#/components/parameters/scheduleId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200':
          description: Updated schedule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/approvals:
    get:
      summary: List requested actions awaiting a second actor
      responses:
        '200':
          description: Approval inbox
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions: {type: array, items: {$ref: '#/components/schemas/Action'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/mission-control:
    get:
      summary: Read a tenant's operational control-plane snapshot
      responses:
        '200':
          description: Real persisted counts, attention queues, recent runs, and schedules
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MissionControl'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/briefing:
    get:
      summary: Read an evidence-backed operating brief for one marketplace
      description: Metrics are calculated only from recognized fields in tenant-owned Evidence; priorities and agent state come from persisted Weekly Ops runs.
      parameters:
        - in: query
          name: platform
          required: false
          schema:
            allOf: [{$ref: '#/components/schemas/MarketplaceId'}]
            default: amazon
      responses:
        '200':
          description: Tenant-safe marketplace briefing without synthetic metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatingBriefing'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/catalog:
    get:
      summary: Read the live platform, report, workflow, and action catalog
      responses:
        '200':
          description: Runtime catalog generated from ontology and service registries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeCatalog'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/audit:
    get:
      summary: Read tenant audit events
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/records:
    get:
      summary: Read tenant-owned connector records
      parameters:
        - in: query
          name: provider
          schema: {type: string}
      responses:
        '200':
          description: Connector records
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: {$ref: '#/components/schemas/ConnectorRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/metrics:
    get:
      summary: Read disposable process counters
      responses:
        '200':
          description: Process counters; not business metrics
          content:
            application/json:
              schema:
                type: object
                required: [counters]
                properties:
                  counters:
                    type: object
                    additionalProperties: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: eai_API_KEY
  parameters:
    accountId:
      in: path
      name: accountId
      required: true
      schema: {type: string, format: uuid}
    recipeId:
      in: path
      name: recipeId
      required: true
      schema: {type: string, format: uuid}
    syncId:
      in: path
      name: syncId
      required: true
      schema: {type: string, format: uuid}
    gateId:
      in: path
      name: gateId
      required: true
      schema: {type: string, format: uuid}
    actionId:
      in: path
      name: actionId
      required: true
      schema: {type: string, format: uuid}
    userId:
      in: path
      name: userId
      required: true
      schema: {type: string, format: uuid}
    keyId:
      in: path
      name: keyId
      required: true
      schema: {type: string, format: uuid}
    runId:
      in: path
      name: runId
      required: true
      schema: {type: string, format: uuid}
    importId:
      in: path
      name: importId
      required: true
      schema: {type: string, format: uuid}
    observationId:
      in: path
      name: observationId
      required: true
      schema: {type: string, format: uuid}
    jobId:
      in: path
      name: jobId
      required: true
      schema: {type: string, format: uuid}
    scheduleId:
      in: path
      name: scheduleId
      required: true
      schema: {type: string, format: uuid}
  responses:
    Unauthorized:
      description: Missing, invalid, or revoked API key
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: Authenticated principal lacks the required role
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotFound:
      description: Resource not found in the authenticated tenant
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: State, uniqueness, or idempotency conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ValidationFailed:
      description: Request failed runtime validation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: Per-client request budget exceeded
      headers:
        Retry-After:
          schema: {type: integer}
          description: Seconds before a retry
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ConnectorFailed:
      description: External connector or model provider failed; durable state is persisted as failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    Role:
      type: string
      enum: [viewer, operator, admin, owner]
    PlatformId:
      type: string
      enum:
        - aliexpress
        - amazon
        - coupang
        - cross_platform
        - ebay
        - faire
        - lazada
        - mercado_libre
        - otto
        - rakuten
        - shopee
        - shopify
        - temu
        - tiktok_shop
        - walmart
        - zalando
    MarketplaceId:
      type: string
      enum:
        - aliexpress
        - amazon
        - coupang
        - ebay
        - faire
        - lazada
        - mercado_libre
        - otto
        - rakuten
        - shopee
        - shopify
        - temu
        - tiktok_shop
        - walmart
        - zalando
    ConnectorProvider:
      type: string
      enum: [amazon_ads, amazon_spapi, shopify]
    EvidenceReportType:
      type: string
      enum:
        - amazon_business_report
        - amazon_ads_search_term
        - amazon_fba_inventory
        - amazon_returns
        - amazon_listing
        - platform_generic
    Health:
      type: object
      required: [status, service]
      properties:
        status: {type: string, enum: [ok]}
        service: {type: string, enum: [ecommerce-ai-runtime]}
    Readiness:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        schema_version: {type: integer}
        reason: {type: string}
    DemoSession:
      type: object
      required: [api_key, tenant_id, tenant_mode, warning]
      properties:
        api_key: {type: string, writeOnly: true}
        tenant_id: {type: string, format: uuid}
        tenant_mode: {type: string, enum: [demo]}
        warning: {type: string}
    Principal:
      type: object
      required: [tenant_id, tenant_name, tenant_mode, user_id, email, role]
      properties:
        tenant_id: {type: string, format: uuid}
        tenant_name: {type: string}
        tenant_mode: {type: string, enum: [production, demo]}
        user_id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
    User:
      type: object
      required: [id, tenant_id, email, role, created_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        created_at: {type: string, format: date-time}
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: {$ref: '#/components/schemas/User'}
    UserCreate:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
    UserRoleUpdate:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {$ref: '#/components/schemas/Role'}
    ApiKeyIssued:
      type: object
      required: [api_key, user_id]
      properties:
        api_key: {type: string, writeOnly: true}
        user_id: {type: string, format: uuid}
    ApiKeyMetadata:
      type: object
      required: [id, key_prefix, created_at, user_id, email, role]
      properties:
        id: {type: string, format: uuid}
        key_prefix: {type: string}
        created_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time, nullable: true}
        user_id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
    ConnectorRegistration:
      oneOf:
        - {$ref: '#/components/schemas/ShopifyConnectorRegistration'}
        - {$ref: '#/components/schemas/AmazonSPAPIConnectorRegistration'}
        - {$ref: '#/components/schemas/AmazonAdsConnectorRegistration'}
      discriminator:
        propertyName: provider
    ConnectorUpdateRequest:
      type: object
      additionalProperties: false
      required: [config]
      properties:
        external_account_id: {type: string, minLength: 1}
        config:
          oneOf:
            - {$ref: '#/components/schemas/ShopifyConnectorConfig'}
            - {$ref: '#/components/schemas/AmazonSPAPIConnectorConfig'}
            - {$ref: '#/components/schemas/AmazonAdsConnectorConfig'}
    ShopifyConnectorRegistration:
      type: object
      additionalProperties: false
      required: [provider, external_account_id, config]
      properties:
        provider: {type: string, enum: [shopify]}
        external_account_id: {type: string, minLength: 1}
        config:
          $ref: '#/components/schemas/ShopifyConnectorConfig'
    AmazonSPAPIConnectorRegistration:
      type: object
      additionalProperties: false
      required: [provider, external_account_id, config]
      properties:
        provider: {type: string, enum: [amazon_spapi]}
        external_account_id: {type: string, minLength: 1}
        config:
          $ref: '#/components/schemas/AmazonSPAPIConnectorConfig'
    AmazonAdsConnectorRegistration:
      type: object
      additionalProperties: false
      required: [provider, external_account_id, config]
      properties:
        provider: {type: string, enum: [amazon_ads]}
        external_account_id: {type: string, minLength: 1}
        config:
          $ref: '#/components/schemas/AmazonAdsConnectorConfig'
    ShopifyConnectorConfig:
      type: object
      additionalProperties: false
      required: [shop_domain, api_version, credential_ref]
      properties:
        shop_domain: {type: string, pattern: '^[a-z0-9][a-z0-9-]*\.myshopify\.com$'}
        api_version: {type: string, pattern: '^20\d{2}-\d{2}$'}
        credential_ref: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,127}$', writeOnly: true}
    AmazonSPAPIConnectorConfig:
      type: object
      additionalProperties: false
      required: [region, marketplace_ids, lwa_client_id_ref, lwa_client_secret_ref, lwa_refresh_token_ref]
      properties:
        region: {type: string, enum: [na, eu, fe]}
        marketplace_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string, pattern: '^[A-Z0-9]{5,20}$'}
        lwa_client_id_ref: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,127}$', writeOnly: true}
        lwa_client_secret_ref: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,127}$', writeOnly: true}
        lwa_refresh_token_ref: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,127}$', writeOnly: true}
    AmazonAdsConnectorConfig:
      type: object
      additionalProperties: false
      required: [region, profile_id, lwa_client_id_ref, lwa_client_secret_ref, lwa_refresh_token_ref]
      properties:
