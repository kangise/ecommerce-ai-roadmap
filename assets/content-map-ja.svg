<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="sans-serif">
  <title id="t">越境EC AI 実践ナレッジベース — コンテンツマップ</title>
  <desc id="d">AI 基礎、店舗運営、マーケットプレイス、ソーシャル、開発者、マネジメントの 6 トラック・56 本の実践ガイド。すべてにコピペで使えるプロンプト付き。CC0。</desc>
  <defs>
    <clipPath id="round"><rect width="1200" height="720" rx="18"/></clipPath>
    <style>
      text{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans CJK JP","Meiryo",sans-serif}
      .h1{font-size:40px;font-weight:800;fill:#ffffff}
      .h2{font-size:20px;fill:#c7d2fe}
      .cred{font-size:14px;fill:#a5b4fc}
      .badge{font-size:20px;font-weight:800;fill:#ffffff}
      .title{font-size:22px;font-weight:700;fill:#1e293b}
      .count{font-size:14px;fill:#64748b}
      .row{font-size:15.5px;fill:#334155}
      .desc{font-size:13px;fill:#94a3b8;font-style:italic}
      .val{font-size:15.5px;fill:#334155}
      .valb{font-size:15.5px;font-weight:700;fill:#4338ca}
