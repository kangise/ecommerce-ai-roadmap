    <text class="h2" x="58" y="106">実践ガイド 56 本 · すべてコピペで使えるプロンプト付き · CC0 完全無料</text>
    <text class="cred" x="1152" y="134" text-anchor="end">An AAAI China Chapter Initiative</text>

    <!-- ===== Row 1 ===== -->
    <g transform="translate(40,180)">
