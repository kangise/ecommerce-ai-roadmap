    </g>

    <!-- Value strip -->
    <line x1="40" y1="648" x2="1160" y2="648" stroke="#e2e8f0"/>
    <text x="600" y="686" text-anchor="middle" class="val">
      <tspan>Colab ノートブック </tspan><tspan class="valb">18</tspan><tspan> 本ワンクリック実行    ·    実績: </tspan><tspan class="valb">ACOS 35% → 18%</tspan><tspan> · Listing </tspan><tspan class="valb">4h → 45min</tspan><tspan>    ·    </tspan><tspan class="valb">CC0</tspan><tspan> 商用利用も無料</tspan>
    </text>
