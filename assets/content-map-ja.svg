      <circle cx="36" cy="38" r="19" fill="#4338ca"/>
      <text class="badge" x="36" y="45" text-anchor="middle">A</text>
      <text class="title" x="64" y="45">店舗運営</text>
      <text class="count" x="339" y="42" text-anchor="end">13 本</text>
      <line x1="18" y1="66" x2="339" y2="66" stroke="#eef2f6"/>
