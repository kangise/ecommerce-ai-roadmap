<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="sans-serif">
  <title id="t">跨境电商 AI 实战知识库 — 内容全景图</title>
  <desc id="d">56 篇实战指南，覆盖 AI 基础、运营、多平台、社交媒体、技术构建、团队管理六大路径，每篇都有可复制的 Prompt，CC0 免费。</desc>
  <defs>
    <clipPath id="round"><rect width="1200" height="720" rx="18"/></clipPath>
    <style>
      text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif}
      .h1{font-size:42px;font-weight:800;fill:#ffffff}
      .h2{font-size:20px;fill:#c7d2fe}
      .cred{font-size:14px;fill:#a5b4fc}
