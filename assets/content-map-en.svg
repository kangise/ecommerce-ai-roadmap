    <g transform="translate(40,412)">
      <rect width="357" height="208" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="36" cy="38" r="19" fill="#4338ca"/>
      <text class="badge" x="36" y="45" text-anchor="middle">E</text>
      <text class="title" x="64" y="45">Social Media</text>
