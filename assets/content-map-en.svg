    <!-- C · Management -->
    <g transform="translate(802,412)">
      <rect width="357" height="208" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="36" cy="38" r="19" fill="#4338ca"/>
      <text class="badge" x="36" y="45" text-anchor="middle">C</text>
      <text class="title" x="64" y="45">Management</text>
      <text class="count" x="339" y="42" text-anchor="end">5 guides</text>
      <line x1="18" y1="66" x2="339" y2="66" stroke="#eef2f6"/>
