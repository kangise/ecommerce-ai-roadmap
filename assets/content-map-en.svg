    <!-- Value strip -->
    <line x1="40" y1="648" x2="1160" y2="648" stroke="#e2e8f0"/>
    <text x="600" y="686" text-anchor="middle" class="val">
      <tspan class="valb">18</tspan><tspan> one-click Colab notebooks    ·    real results: </tspan><tspan class="valb">ACOS 35% → 18%</tspan><tspan> · Listing </tspan><tspan class="valb">4h → 45min</tspan><tspan>    ·    </tspan><tspan class="valb">CC0</tspan><tspan> public domain, free for commercial use</tspan>
    </text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="719" rx="18" fill="none" stroke="#e2e8f0"/>
