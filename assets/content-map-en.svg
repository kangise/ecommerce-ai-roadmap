    <text class="h2" x="58" y="106">56 hands-on guides · copy-paste prompts in every guide · CC0, completely free</text>
    <text class="cred" x="1152" y="134" text-anchor="end">An AAAI China Chapter Initiative</text>

    <!-- ===== Row 1 ===== -->
    <!-- 0 · AI Foundations -->
    <g transform="translate(40,180)">
      <rect width="357" height="208" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="36" cy="38" r="19" fill="#4338ca"/>
      <text class="badge" x="36" y="45" text-anchor="middle">0</text>
      <text class="title" x="64" y="45">AI Foundations</text>
      <text class="count" x="339" y="42" text-anchor="end">7 guides</text>
      <line x1="18" y1="66" x2="339" y2="66" stroke="#eef2f6"/>
      <text class="row" x="22" y="104">AI literacy · Prompt engineering · RAG</text>
      <text class="row" x="22" y="140">Agents · RPA · Tool comparison</text>
      <text class="desc" x="22" y="180">No coding required</text>
    </g>
    <!-- A · Operations -->
    <g transform="translate(421,180)">
      <rect width="357" height="208" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="36" cy="38" r="19" fill="#4338ca"/>
      <text class="badge" x="36" y="45" text-anchor="middle">A</text>
      <text class="title" x="64" y="45">Operations</text>
      <text class="count" x="339" y="42" text-anchor="end">13 guides</text>
      <line x1="18" y1="66" x2="339" y2="66" stroke="#eef2f6"/>
      <text class="row" x="22" y="104">Sourcing → Content → Traffic → Service</text>
      <text class="row" x="22" y="140">Pricing · Ads · SEO/GEO · Compliance</text>
      <text class="desc" x="22" y="180">The full funnel, Amazon-first</text>
    </g>
    <!-- D · Marketplaces -->
    <g transform="translate(802,180)">
      <rect width="357" height="208" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="36" cy="38" r="19" fill="#4338ca"/>
      <text class="badge" x="36" y="45" text-anchor="middle">D</text>
      <text class="title" x="64" y="45">Marketplaces</text>
      <text class="count" x="339" y="42" text-anchor="end">14 guides</text>
      <line x1="18" y1="66" x2="339" y2="66" stroke="#eef2f6"/>
      <text class="row" x="22" y="104">Shopify · TikTok Shop · Walmart</text>
      <text class="row" x="22" y="140">eBay · Temu · APAC · EU · LatAm</text>
      <text class="desc" x="22" y="180">Playbooks for 13+ platforms</text>
    </g>

    <!-- ===== Row 2 ===== -->
