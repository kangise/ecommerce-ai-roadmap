name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned to the version verified locally against this book.toml
      MDBOOK_VERSION: "0.5.4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Best-effort switch of the Pages source to "GitHub Actions"
          enablement: true

      - name: Build with mdBook (zh, then en/ja into subdirs)
        run: |
          # --dest-dir resolves against the working directory, not the book root,
          # so these must be plain docs/en and docs/ja. With ../../ they landed
          # outside the repo and the EN/JA sites silently never shipped.
          # zh must build first: mdBook wipes its dest dir, which is docs/.
          mdbook build
          mdbook build i18n/en --dest-dir docs/en
          mdbook build i18n/ja --dest-dir docs/ja

      - name: Verify all three books are in the artifact
        run: |
          for f in docs/index.html docs/en/index.html docs/ja/index.html; do
            test -s "$f" || { echo "::error::missing $f — the trilingual build is incomplete"; exit 1; }
          done
          echo "zh/en/ja all present"

      - name: Check content
        run: |
          # Nine checks, each must be zero: anchors, cross-file anchors, links,
          # python blocks compile, trilingual parity, and the four content gates
          # (sourced claims, boundary sections, external links, orphan pages).
          # Offline by design — M4 reads the committed probe cache, so a link
          # nobody probed fails here rather than the build depending on the
          # network. Refresh it with --probe-links before merging new links.
          python3 scripts/verify_content.py --list

      - name: Check anchors against the built HTML
        run: |
          # slugify() reproduces mdBook's anchor rules, and every other link
          # check trusts it. This diffs what the script derives from markdown
          # against the ids mdBook actually emitted, so a version bump that
          # changes the rules is caught here rather than by a reader hitting a
          # dead in-page link.
          python3 scripts/verify_content.py --anchors-vs-build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # book.toml sets build-dir = "docs"
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
