name: Weekly health check
on:
  schedule:
    - cron: "0 3 * * 1"      # Every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r tests/requirements.txt

      # Re-probe all external links, refresh the cache
      - run: python3 scripts/verify_content.py --probe-links

      # Full gate suite. A broken scheduled check must remain visible.
      - run: python3 -m pytest
      - run: python3 scripts/verify_all.py

      # Review cadence. M7 only fires once a fact has already expired or a batch
      # is already overdue; this surfaces the queue while there is still time to
      # act on it. Non-blocking: a batch coming due is a task, not a broken build.
      - name: Fact review queue
        continue-on-error: true
        run: python3 scripts/fact_review.py --due-within 90

      # Upstream API specs the runtime is written against. Reports only — an
      # upstream commit is not by itself a problem, so this must not gate.
      # --update lets the state land in the PR this workflow already opens.
      # Content quality report. Expected to return findings — they are judgment
      # calls, not defects, so this must never gate.
      - name: Content audit
        continue-on-error: true
        run: python3 scripts/audit_content.py --list

      - name: Upstream source watch
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/watch_sources.py --update

      # Open a PR if anything changed (dead links, probe cache)
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/weekly-health
          title: "chore: weekly link probe + gate report"
          body: |
            自动周检。链接缓存已刷新，门禁读数见 Actions 日志。
            **合并前先看死链是不是真死**——Kaggle Learn 和
            shopify.com/magic 都对 HEAD 返 404 但 GET 正常。
