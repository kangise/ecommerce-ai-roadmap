- id: a_plus_content
  label:
    zh: A+ Content
    en: A+ Content
    ja: A+コンテンツ
  definition:
    zh: Amazon 品牌卖家可用的模块化增强内容（品牌故事、图文模块、对比图、使用场景、FAQ），无字符限制，是 Rufus 与 COSMO 读取的信息源之一
    en: Modular enhanced content for Amazon brand sellers (brand story, image-text
