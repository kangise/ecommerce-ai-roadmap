    zh: 产品图片
    en: Product Image
    ja: 商品画像
  definition:
    zh: Amazon Listing 中的图片，含 1 张白底主图和 6 张副图；主图禁止文字/logo/水印，副图可承载文字信息图
    en: 'Images of an Amazon listing: one white-background main image plus six secondary
      images; text/logo/watermark are forbidden on the main image'
    ja: Amazon リスティングの画像。白背景のメイン画像1点とサブ画像6点で構成。メイン画像への文字・ロゴ・透かしは禁止
