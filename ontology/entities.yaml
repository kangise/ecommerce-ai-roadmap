- id: listing
  label:
    zh: Listing
    en: Listing
    ja: リスティング
  definition:
    zh: Amazon 商品上架信息的统称，包含标题、五点、产品描述、A+ Content、Search Terms 与图片等组成部分，是"被搜索到"与"被点击购买"的载体
    en: The full set of product content fields on an Amazon listing (title, bullet
      points, description, A+ Content, Search Terms, images) that bridges search visibility
      and purchase conversion
    ja: Amazon の商品出品情報一式。タイトル・箇条書き・商品説明・A+ Content・Search Terms・画像などで構成され、検索露出と購入転換をつなぐ
  attributes:
  - id: title
    type: string
    label:
      zh: 标题
      en: Title
      ja: タイトル
  - id: description
    type: text
    label:
      zh: 产品描述
      en: Description
      ja: 商品説明
  - id: search_terms
    type: text
    label:
      zh: 后台 Search Terms
      en: Backend Search Terms
      ja: バックエンド検索キーワード
  source:
  - src/a-operators/a2-listing-optimization.md#12-listing-的组成部分
  - src/a-operators/a2-listing-optimization.md#1-listing-方法论ai-之前你需要理解的基础
- id: bullet_point
  label:
    zh: 五点
    en: Bullet Point
    ja: 箇条書き
  definition:
    zh: Amazon Listing 中的卖点条目，通常 5 条，每条以大写卖点短语开头，先讲用户利益再讲产品特性
    en: One of the selling-point lines in an Amazon listing (typically five), each
      starting with an all-caps benefit phrase, benefit before feature
    ja: Amazon リスティングのセールスポイント行。通常5本で、大文字のメリット句で始め、ベネフィット→機能の順で書く
  attributes:
  - id: content
    type: string
    label:
      zh: 内容
      en: Content
      ja: 内容
  - id: position
    type: integer
    label:
      zh: 顺序
      en: Position
      ja: 順序
  source:
  - src/a-operators/a2-listing-optimization.md#12-listing-的组成部分
- id: search_term
  label:
    zh: Search Term
    en: Search Term
    ja: サーチターム
  definition:
    zh: Amazon 后台的隐藏关键词字段，用户不可见但参与索引，共 250 字节，用于覆盖标题和五点放不下的长尾词
    en: The hidden backend keyword field on Amazon that is indexed but not visible
      to shoppers; 250 bytes total, used to cover long-tail keywords not in the title
      or bullets
    ja: Amazon のバックエンド非表示キーワードフィールド。ユーザーには見えないがインデックスされ、合計250バイトでタイトルや箇条書きに載せきれないロングテール語を補う
  attributes:
  - id: content
    type: string
    label:
      zh: 关键词内容
      en: Content
      ja: 内容
  - id: byte_length
    type: integer
    label:
      zh: 字节数
      en: Byte length
      ja: バイト数
  source:
  - src/a-operators/a2-listing-optimization.md#35-search-terms-优化
- id: asin
  label:
    zh: ASIN
    en: ASIN
    ja: ASIN
  definition:
    zh: Amazon 标准识别编号，每个上架商品有唯一 ASIN；放入 Search Terms 没有索引价值
    en: Amazon Standard Identification Number, unique per listed product; carries
      no indexing value inside Search Terms
    ja: Amazon 標準識別番号。商品ごとに一意。Search Terms に含めてもインデックス価値がない
