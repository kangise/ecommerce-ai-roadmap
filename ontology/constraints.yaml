- id: inventory.stockout_cost_formula
  entity: inventory
  attribute: stockout_cost
  platform: null
  kind: formula
  value: 断货天数 × 日均销量 × 客单价 × 利润率 + 排名恢复成本
  statement:
    zh: 缺货成本 = 断货天数 × 日均销量 × 客单价 × 利润率 + 排名恢复成本；断货 7 天以上关键词排名下滑，恢复需 2-4 周广告投入
    en: Stockout cost = days out of stock × daily sales × price × margin + rank-recovery
      cost; 7+ days out of stock hurts keyword rank, recovery costs 2-4 weeks of ads
  source: src/a-operators/a5-inventory.md#11-库存管理的第一性原理
  verified: 2026-08
- id: inventory.stagnation_cost_formula
