  attribute: stagnation_cost
  platform: null
  kind: formula
  value: 库存数量 × 单位仓储费 × 滞销天数 + 长期仓储费 + 资金占用成本
  statement:
    zh: 滞销成本 = 库存数量 × 单位仓储费 × 滞销天数 + 长期仓储费 + 资金占用成本
    en: Stagnation cost = qty × unit storage fee × stagnant days + long-term storage
      fee + capital cost
  source: src/a-operators/a5-inventory.md#11-库存管理的第一性原理
  verified: 2026-08
- id: inventory.days_of_stock_formula
  entity: days_of_stock
  attribute: value
  platform: null
  kind: formula
  value: (当前库存 + 在途库存) ÷ 日均销量
  statement:
    zh: 库存可支撑天数 = (当前库存 + 在途库存) ÷ 日均销量；低于 Lead Time + 安全天数时需要补货
    en: Days of stock = (current stock + in-transit) / daily sales; replenish when
      below lead time + safety days
  source: src/a-operators/a5-inventory.md#安全库存与补货公式速查
  verified: 2026-08
- id: inventory.turnover_formula
  entity: inventory_turnover
