  platform: amazon
  kind: format
  value: broad
  statement:
    zh: Broad Match 是探索性流量，应出价最低（关键词发现器）；Broad、Phrase、Exact 不应使用同一出价
    en: Broad match is exploratory traffic and should carry the lowest bid (the "keyword
      finder"); broad, phrase and exact must not share one bid
    ja: 部分一致は探索的なトラフィックで、最低入札が推奨
  source: src/a-operators/a3-advertising.md#51-出价相关陷阱
  verified: 2026-08
- id: amazon.match_type.phrase.behavior
  entity: match_type
  attribute: name
  platform: amazon
  kind: format
  value: phrase
  statement:
    zh: Phrase Match 介于 Broad 与 Exact 之间；Phrase 中需要否定的无关词应单独识别
    en: Phrase match sits between broad and exact; irrelevant terms appearing in phrase
      match must be negated separately
    ja: フレーズ一致は部分一致と完全一致の中間
  source: src/a-operators/a3-advertising.md#31-搜索词报告分析
  verified: 2026-08
- id: amazon.negative_keyword.exact.behavior
  entity: negative_keyword
  attribute: type
  platform: amazon
  kind: format
  value: negative_exact
  statement:
    zh: 精确否定只屏蔽完全匹配的搜索词，否定范围最小，不会误伤包含该词的其它搜索词
    en: Negative exact blocks only the fully-matching search term; it has the narrowest
      blast radius
    ja: 否定完全一致は完全一致する検索語のみをブロック
  source: src/a-operators/a3-advertising.md#33-否定关键词策略
  verified: 2026-08
- id: amazon.negative_keyword.phrase.behavior
  entity: negative_keyword
  attribute: type
  platform: amazon
  kind: format
  value: negative_phrase
  statement:
    zh: 短语否定会屏蔽包含该短语的所有搜索词（如所有含 "free" 的搜索词），范围更大，用错会误伤有效流量
    en: Negative phrase blocks every search term containing the phrase (e.g. all terms
      containing "free"); wider blast radius, misuse harms valid traffic
    ja: 否定フレーズはフレーズを含む全検索語をブロック
  source: src/a-operators/a3-advertising.md#33-否定关键词策略
  verified: 2026-08
- id: amazon.bid.value.suggested_bid_start
  entity: bid
  attribute: amount
  platform: amazon
  kind: format
  value: 80%..100% of suggested bid; 120% for new products
