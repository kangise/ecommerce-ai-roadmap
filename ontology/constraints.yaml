  value: 年销售额 ÷ 平均库存价值
  statement:
    zh: 库存周转率 = 年销售额 ÷ 平均库存价值，越高说明库存流转快
    en: Inventory turnover = annual sales / average inventory value; higher is better
  source: src/a-operators/a5-inventory.md#安全库存与补货公式速查
  verified: 2026-08
- id: inventory.eoq_formula
