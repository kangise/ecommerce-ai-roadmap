    zh: 补货点 = 日均销量 × Lead Time + 安全库存；库存降到该水位时下单补货
    en: Reorder point = daily sales × lead time + safety stock; place order when stock
      falls to this level
  source: src/a-operators/a5-inventory.md#11-库存管理的第一性原理
  verified: 2026-08
