    en: Ad rank = bid × relevance × conversion rate; a high-converting listing can
      outrank competitors with a lower bid
    ja: 広告順位 = 入札額 × 関連性 × コンバージョン率
  source: src/a-operators/a3-advertising.md#11-amazon-广告的第一性原理
  verified: 2026-08
- id: amazon.acos.value.formula
  entity: acos
  attribute: value
  platform: amazon
  kind: format
  value: ad_spend / ad_sales * 100%
  statement:
    zh: ACOS = 广告花费 ÷ 广告销售额 × 100%（例：$100 花费 / $400 销售额 = 25%）
    en: ACOS = ad spend / ad sales × 100% (e.g. $100 spend on $400 ad sales = 25%)
    ja: ACOS = 広告費 ÷ 広告売上 × 100%
  source: src/a-operators/a3-advertising.md#12-acos--tacos--roas-的关系和计算
  verified: 2026-08
- id: amazon.tacos.value.formula
  entity: tacos
  attribute: value
  platform: amazon
  kind: format
  value: ad_spend / total_sales * 100%
  statement:
    zh: TACOS = 广告花费 ÷ 总销售额（广告+自然）× 100%；TACOS 持续下降说明自然流量在增长
    en: TACOS = ad spend / total sales (ads + organic) × 100%; falling TACOS means
      organic traffic is growing
    ja: TACOS = 広告費 ÷ 総売上 × 100%
  source: src/a-operators/a3-advertising.md#12-acos--tacos--roas-的关系和计算
  verified: 2026-08
- id: amazon.roas.value.formula
  entity: roas
  attribute: value
  platform: amazon
  kind: format
  value: ad_sales / ad_spend
  statement:
    zh: ROAS = 广告销售额 ÷ 广告花费；且 ROAS = 1 / ACOS（ACOS 25% = ROAS 4.0）
    en: ROAS = ad sales / ad spend; equivalently ROAS = 1 / ACOS (ACOS 25% ↔ ROAS
      4.0)
    ja: ROAS = 広告売上 ÷ 広告費。ROAS = 1 / ACOS
  source: src/a-operators/a3-advertising.md#12-acos--tacos--roas-的关系和计算
  verified: 2026-08
- id: amazon.ctr.value.formula
  entity: ctr
  attribute: value
  platform: amazon
  kind: format
  value: clicks / impressions * 100%
  statement:
    zh: CTR = 点击数 ÷ 展示量 × 100%（例：200 点击 / 50000 展示 = 0.4%）
    en: CTR = clicks / impressions × 100% (e.g. 200 clicks / 50,000 impressions =
      0.4%)
    ja: CTR = クリック数 ÷ インプレッション数 × 100%
  source: src/a-operators/a3-advertising.md#acos--tacos--roas-计算速查
  verified: 2026-08
- id: amazon.cpc.value.formula
  entity: cpc
  attribute: value
  platform: amazon
  kind: format
  value: ad_spend / clicks
  statement:
    zh: CPC = 广告花费 ÷ 点击数（例：$100 / 200 点击 = $0.50）
    en: CPC = ad spend / clicks (e.g. $100 / 200 clicks = $0.50)
    ja: CPC = 広告費 ÷ クリック数
  source: src/a-operators/a3-advertising.md#acos--tacos--roas-计算速查
  verified: 2026-08
- id: amazon.cvr.value.formula
