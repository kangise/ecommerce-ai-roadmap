  attribute: value
  platform: amazon
  kind: format
  value: product_margin
  statement:
    zh: 盈亏平衡 ACOS = 产品利润率；ACOS < 利润率广告盈利，= 利润率盈亏平衡，> 利润率亏损（但可能在推排名）
    en: Break-even ACOS = product margin; below margin the ad is profitable, at margin
