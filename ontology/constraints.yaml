    zh: Coupang 使用 Rocket Delivery 排名大幅提升（次日达/当日达/凌晨配送）；Rocket Growth 为跨境卖家专用（有一定加权），卖家自发货排名较低
    en: Coupang listings on Rocket Delivery get a major ranking boost (next-day/same-day/dawn
