    zh: 起始出价从建议出价的 80% 开始逐步提高；至少出到建议出价的 100%；新品期可出 120%
    en: Start bids at 80% of the suggested bid and raise gradually; bid at least 100%
      of suggested; new products may bid 120%
    ja: 入札は推奨額の 80% から開始し、少なくとも 100% まで。新商品は 120% 可
  source: src/a-operators/a3-advertising.md#51-出价相关陷阱
  verified: 2026-08
- id: amazon.bid.value.new_product_multiplier
  entity: bid
  attribute: amount
  platform: amazon
  kind: format
  value: 1.2x suggested bid (Week 1)
