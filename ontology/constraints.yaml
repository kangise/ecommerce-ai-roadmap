  attribute: value
  platform: amazon
  kind: format
  value: second_highest_bid + 0.01
  unit: USD
  statement:
    zh: Amazon PPC 采用第二价格拍卖，实际支付的 CPC = 第二高出价 + $0.01，不需要出最高价
    en: Amazon PPC uses a second-price auction; actual CPC paid = second-highest bid
      + $0.01, so you need not bid the highest
    ja: Amazon PPC は第二価格オークション。実支払 CPC = 2番目入札額 + $0.01
  source: src/a-operators/a3-advertising.md#11-amazon-广告的第一性原理
