    zh: 韩国对电子产品、儿童用品、家电强制要求 KC 安全认证，没有不能销售；电子/电气产品还需 KC 电磁兼容认证；食品需韩 FDA、化妆品需 MFDS
      注册
    en: Korea mandates KC safety certification for electronics, children's products
      and appliances — no certification, no sales; EMC (KC) also required for electrical
      goods; food needs Korean FDA, cosmetics MFDS registration
    ja: 韓国は電子・子供用品・家電に KC 安全認証を義務付け（認証なしで販売不可）。電気製品は KC 電磁適合も必要。食品は韓国FDA、化粧品はMFDS登録
