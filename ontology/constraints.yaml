    en: Week 1 new-product Auto campaigns bid 1.2× the suggested bid to win impressions
    ja: 新商品 1 週目の入札は推奨額の 1.2 倍
  source: src/a-operators/a3-advertising.md#41-新品广告启动-sop30-天计划
  verified: 2026-08
- id: amazon.bid.value.max_adjustment_per_week
