# E-Commerce Business Processes
# Formal workflows extracted from the chapter sequence a1→a14.
# Each step consumes entities produced by prior steps and produces entities for later steps.
#
# Schema:
# - id: process_id
#   label: {zh: ..., en: ..., ja: ...}
#   steps:
#     - chapter: path/to/chapter.md
#       consumes: [entity_id, ...] | null
#       produces: [entity_id, ...]
#       source: path/to/chapter.md#anchor

- id: new_product_launch
  label: {zh: 新品上架流程, en: New Product Launch, ja: 新商品の出品フロー}
  steps:
    - chapter: src/a-operators/a1-product-research.md
      consumes: null
      produces: [product_candidate]
      source: src/a-operators/a1-product-research.md
    - chapter: src/a-operators/a2-listing-optimization.md
      consumes: [product_candidate]
      produces: [listing, bullet_point, search_term, asin, product_image]
      source: src/a-operators/a2-listing-optimization.md
    - chapter: src/a-operators/a3-advertising.md
      consumes: [listing, asin]
      produces: [campaign, ad_group, keyword, bid, budget]
      source: src/a-operators/a3-advertising.md
    - chapter: src/a-operators/a8-pricing-strategy.md
      consumes: [listing, campaign]
      produces: [price, profit_estimate]
      source: src/a-operators/a8-pricing-strategy.md

- id: customer_service_loop
  label: {zh: 客服循环, en: Customer Service Loop, ja: カスタマーサービスループ}
  steps:
    - chapter: src/a-operators/a4-customer-service.md
      consumes: [order, review]
      produces: [customer_response, dispute_resolution]
      source: src/a-operators/a4-customer-service.md
    - chapter: src/a-operators/a2-listing-optimization.md
      consumes: [review, customer_response]
      produces: [listing_update]
      source: src/a-operators/a2-listing-optimization.md

- id: inventory_replenishment
  label: {zh: 库存补货流程, en: Inventory Replenishment, ja: 在庫補充フロー}
  steps:
    - chapter: src/a-operators/a5-inventory.md
      consumes: [listing, order]
      produces: [stock_level, safety_stock, reorder_point, restock_recommendation]
      source: src/a-operators/a5-inventory.md
    - chapter: src/a-operators/a5-inventory.md
      consumes: [restock_recommendation]
      produces: [purchase_order]
      source: src/a-operators/a5-inventory.md
    - chapter: src/a-operators/a5-inventory.md
      consumes: [purchase_order]
      produces: [shipment, inventory_update]
      source: src/a-operators/a5-inventory.md

- id: compliance_review
  label: {zh: 合规审核流程, en: Compliance Review, ja: コンプライアンス審査フロー}
