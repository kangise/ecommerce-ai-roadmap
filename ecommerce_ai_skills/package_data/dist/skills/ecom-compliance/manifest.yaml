description: Check product compliance requirements, classify HS codes, screen IP risks,
  and handle platform documentation
inputs:
- description: 'Product details: category, materials, components, intended use'
  name: product_info
  required: true
  type: object
- description: Target market countries (US, EU, JP, etc.)
  name: target_markets
  required: true
  type: array
- description: Brand/trademark information for IP screening
  name: brand_info
  required: false
  type: object
name: ecom-compliance
outputs:
- description: Required certifications, HS codes, IP risks, and documentation checklist
  name: compliance_report
  type: object
platforms:
- amazon
- shopify
triggers:
  intent: check_compliance | classify_hs_code | screen_ip_risk | prepare_documentation
  keywords:
  - CE
  - FCC
  - FDA
  - HS code
  - HS编码
  - REACH
  - category approval
  - certification
  - compliance
  - customs
  - dangerous goods
  - import
  - intellectual property
  - patent
  - regulatory
  - trademark
  - 下架
  - 专利
  - 侵权
  - 出口到
  - 危险品
  - 发达国家
  - 合规
  - 商标
  - 安全文件
  - 律师函
  - 电池
  - 空运限制
  - 类目审核
  - 要做哪些准备
  - 认证
  - 认证要求
  - 证书
  - 跟卖
  - 锂电池
  - 额外
uses_constraints:
- amazon.account.monthly_spend.analysis_cadence
- amazon.bid.value.new_product_multiplier
- amazon.bsa.tool_compliance
- amazon.cpc.value.actual_price_formula
- amazon.de.listing.required_certifications
- amazon.fba.inventory.excess_inventory_threshold
- amazon.fba.inventory.inbound_processing_time
- amazon.fba.inventory.ipi_score_min
- amazon.fba.inventory.storage_restriction_on_low_ipi
- amazon.jp.listing.required_certifications
- amazon.keyword.placement.one_ad_group_only
- amazon.listing.description.max_length
- amazon.listing.description.recommended_max_length
- amazon.promo.bid.event_multiplier
- amazon.promo.budget.event_multiplier
- amazon.promo.budget.pre_event_multiplier
- amazon.safety_complaint.response_deadline
- amazon.sponsored_brand.video.ctr_multiple
- amazon.us.listing.required_certifications
- amazon.violation.response_deadline
- compliance.ce_marking.mandatory
- compliance.ce_marking.min_height
