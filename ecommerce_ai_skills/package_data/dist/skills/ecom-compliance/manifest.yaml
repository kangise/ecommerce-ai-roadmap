- eu.gpsr.responsible_person
- eu.label.local_language
- eu.label.manufacturer_info
- eu.vat.registration_before_sale
- google.search_ad.description_max_length
- inventory.lead_time_safety_rule
- inventory.promo_lead_time
- inventory.promo_safety_buffer
- inventory.promo_sales_multiplier
- inventory.safety_stock_formula
- inventory.service_level_z_factors
- ip.trademark.search_before_naming
- ip.tro.risk_prevention
- ip_risk.high_requires_fto
- shopify.product_feed.description.key_first_160
