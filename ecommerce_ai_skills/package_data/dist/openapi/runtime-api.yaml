          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRunBundle'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/agent-runs/{runId}/events:
    get:
      summary: Read an incremental event page for a run
      parameters:
        - {$ref: '#/components/parameters/runId'}
        - in: query
          name: after
          schema: {type: string, pattern: '^[0-9]+$'}
          description: SQLite event sequence cursor returned as next_cursor
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Tenant-scoped event page
          content:
            application/json:
              schema:
                type: object
                required: [events, next_cursor]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/AgentEvent'}
                  next_cursor: {type: string, nullable: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/agent-runs/{runId}/execute:
    post:
      summary: Execute the bound Domain Agent Graph and independent Reviewer
      description: Requires operator or higher plus OPENAI_API_KEY and EAI_OPENAI_MODEL in the server environment. Application code runs the Evidence Analyst and dynamic marketplace specialists in parallel, then the optional cross-platform controller, Manager, and Reviewer sequentially. No model tools are exposed.
      parameters:
        - {$ref: '#/components/parameters/runId'}
      responses:
        '200':
          description: Completed run, or the existing result for an already completed run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRunBundle'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/ConnectorFailed'}
  /v1/agent-runs/{runId}/evaluate:
    post:
      summary: Evaluate a completed Weekly Ops run with deterministic graders
      parameters:
        - {$ref: '#/components/parameters/runId'}
      responses:
        '200':
          description: Persisted workflow evaluation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentEvaluation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/agent-runs/{runId}/evaluations:
    get:
      summary: List persisted evaluations for a run
      parameters:
        - {$ref: '#/components/parameters/runId'}
      responses:
        '200':
          description: Workflow evaluations
          content:
            application/json:
              schema:
                type: object
                required: [evaluations]
                properties:
                  evaluations:
                    type: array
                    items: {$ref: '#/components/schemas/AgentEvaluation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/jobs:
    get:
      summary: List tenant-owned durable jobs
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Durable jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: {type: array, items: {$ref: '#/components/schemas/Job'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Enqueue an agent run for background execution
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobRequest'}
      responses:
        '200':
          description: Existing or new durable job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/jobs/{jobId}:
    get:
      summary: Read one tenant-owned durable job
      parameters:
        - {$ref: '#/components/parameters/jobId'}
      responses:
        '200':
          description: Durable job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/schedules:
    get:
      summary: List tenant-owned interval schedules
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules: {type: array, items: {$ref: '#/components/schemas/Schedule'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Schedule repeated Weekly Ops runs
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleCreate'}
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/schedules/{scheduleId}:
    patch:
      summary: Enable or disable a schedule
      parameters:
        - {$ref: '#/components/parameters/scheduleId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200':
          description: Updated schedule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/approvals:
    get:
      summary: List requested actions awaiting a second actor
      responses:
        '200':
          description: Approval inbox
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions: {type: array, items: {$ref: '#/components/schemas/Action'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/mission-control:
    get:
      summary: Read a tenant's operational control-plane snapshot
      responses:
        '200':
          description: Real persisted counts, attention queues, recent runs, and schedules
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MissionControl'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/briefing:
    get:
      summary: Read an evidence-backed operating brief for one marketplace
      description: Metrics are calculated only from recognized fields in tenant-owned Evidence; priorities and agent state come from persisted Weekly Ops runs.
      parameters:
        - in: query
          name: platform
          required: false
          schema:
            allOf: [{$ref: '#/components/schemas/MarketplaceId'}]
            default: amazon
      responses:
        '200':
          description: Tenant-safe marketplace briefing without synthetic metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatingBriefing'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/catalog:
    get:
      summary: Read the live platform, report, workflow, and action catalog
      responses:
        '200':
          description: Runtime catalog generated from ontology and service registries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeCatalog'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/audit:
    get:
      summary: Read tenant audit events
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/records:
    get:
      summary: Read tenant-owned connector records
      parameters:
        - in: query
          name: provider
          schema: {type: string}
      responses:
        '200':
          description: Connector records
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: {$ref: '#/components/schemas/ConnectorRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/metrics:
    get:
      summary: Read disposable process counters
      responses:
        '200':
          description: Process counters; not business metrics
          content:
            application/json:
              schema:
                type: object
                required: [counters]
                properties:
                  counters:
                    type: object
                    additionalProperties: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: eai_API_KEY
  parameters:
    idempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 1, maxLength: 200}
    proposalId:
      in: path
      name: proposalId
      required: true
      schema: {type: string, format: uuid}
    executionId:
      in: path
      name: executionId
      required: true
      schema: {type: string, format: uuid}
    graphId:
      in: path
      name: graphId
      required: true
      schema: {type: string, format: uuid}
    versionId:
      in: path
      name: versionId
      required: true
      schema: {type: string, format: uuid}
    accountId:
      in: path
      name: accountId
      required: true
      schema: {type: string, format: uuid}
    recipeId:
      in: path
      name: recipeId
      required: true
      schema: {type: string, format: uuid}
    syncId:
      in: path
      name: syncId
      required: true
      schema: {type: string, format: uuid}
    gateId:
      in: path
      name: gateId
      required: true
      schema: {type: string, format: uuid}
    actionId:
      in: path
      name: actionId
      required: true
      schema: {type: string, format: uuid}
    userId:
      in: path
      name: userId
      required: true
      schema: {type: string, format: uuid}
    keyId:
      in: path
      name: keyId
      required: true
      schema: {type: string, format: uuid}
    runId:
      in: path
      name: runId
      required: true
      schema: {type: string, format: uuid}
    importId:
      in: path
      name: importId
      required: true
      schema: {type: string, format: uuid}
    observationId:
      in: path
      name: observationId
      required: true
      schema: {type: string, format: uuid}
    jobId:
      in: path
      name: jobId
      required: true
      schema: {type: string, format: uuid}
    scheduleId:
      in: path
      name: scheduleId
      required: true
      schema: {type: string, format: uuid}
  responses:
    Unauthorized:
      description: Missing, invalid, or revoked API key
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: Authenticated principal lacks the required role
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotFound:
      description: Resource not found in the authenticated tenant
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: State, uniqueness, or idempotency conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ValidationFailed:
      description: Request failed runtime validation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: Per-client request budget exceeded
      headers:
        Retry-After:
          schema: {type: integer}
          description: Seconds before a retry
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ConnectorFailed:
      description: External connector or model provider failed; durable state is persisted as failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    Role:
      type: string
      enum: [viewer, operator, admin, owner]
    PlatformId:
      type: string
      enum:
        - aliexpress
        - amazon
        - coupang
        - cross_platform
        - ebay
        - faire
        - lazada
        - mercado_libre
        - otto
        - rakuten
        - shopee
        - shopify
        - temu
        - tiktok_shop
        - walmart
        - zalando
    MarketplaceId:
      type: string
      enum:
        - aliexpress
        - amazon
        - coupang
        - ebay
        - faire
        - lazada
        - mercado_libre
        - otto
        - rakuten
        - shopee
        - shopify
        - temu
        - tiktok_shop
        - walmart
        - zalando
    ConnectorProvider:
      type: string
      enum: [amazon_ads, amazon_spapi, shopify]
    EvidenceReportType:
      type: string
      enum:
        - amazon_business_report
        - amazon_ads_search_term
        - amazon_fba_inventory
        - amazon_returns
        - amazon_listing
        - platform_generic
    Health:
      type: object
      required: [status, service]
      properties:
        status: {type: string, enum: [ok]}
        service: {type: string, enum: [ecommerce-ai-runtime]}
    Readiness:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        schema_version: {type: integer}
        reason: {type: string}
    DemoSession:
      type: object
      required: [api_key, tenant_id, tenant_mode, warning]
      properties:
        api_key: {type: string, writeOnly: true}
        tenant_id: {type: string, format: uuid}
        tenant_mode: {type: string, enum: [demo]}
        warning: {type: string}
    Principal:
      type: object
      required: [tenant_id, tenant_name, tenant_mode, user_id, email, role]
      properties:
        tenant_id: {type: string, format: uuid}
        tenant_name: {type: string}
        tenant_mode: {type: string, enum: [production, demo]}
        user_id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
    User:
      type: object
      required: [id, tenant_id, email, role, created_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        created_at: {type: string, format: date-time}
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: {$ref: '#/components/schemas/User'}
    UserCreate:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
    UserRoleUpdate:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {$ref: '#/components/schemas/Role'}
    ApiKeyIssued:
      type: object
      required: [api_key, user_id]
      properties:
        api_key: {type: string, writeOnly: true}
        user_id: {type: string, format: uuid}
    ApiKeyMetadata:
      type: object
      required: [id, key_prefix, created_at, user_id, email, role]
      properties:
        id: {type: string, format: uuid}
        key_prefix: {type: string}
        created_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time, nullable: true}
        user_id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
    ConnectorRegistration:
      oneOf:
        - {$ref: '#/components/schemas/ShopifyConnectorRegistration'}
        - {$ref: '#/components/schemas/AmazonSPAPIConnectorRegistration'}
        - {$ref: '#/components/schemas/AmazonAdsConnectorRegistration'}
      discriminator:
        propertyName: provider
    ConnectorUpdateRequest:
      type: object
      additionalProperties: false
      required: [config]
      properties:
        external_account_id: {type: string, minLength: 1}
        config:
          oneOf:
            - {$ref: '#/components/schemas/ShopifyConnectorConfig'}
            - {$ref: '#/components/schemas/AmazonSPAPIConnectorConfig'}
            - {$ref: '#/components/schemas/AmazonAdsConnectorConfig'}
    ShopifyConnectorRegistration:
      type: object
      additionalProperties: false
      required: [provider, external_account_id, config]
      properties:
        provider: {type: string, enum: [shopify]}
        external_account_id: {type: string, minLength: 1}
        config:
          $ref: '#/components/schemas/ShopifyConnectorConfig'
    AmazonSPAPIConnectorRegistration:
      type: object
      additionalProperties: false
      required: [provider, external_account_id, config]
      properties:
        provider: {type: string, enum: [amazon_spapi]}
        external_account_id: {type: string, minLength: 1}
        config:
          $ref: '#/components/schemas/AmazonSPAPIConnectorConfig'
    AmazonAdsConnectorRegistration:
      type: object
      additionalProperties: false
      required: [provider, external_account_id, config]
      properties:
        provider: {type: string, enum: [amazon_ads]}
        external_account_id: {type: string, minLength: 1}
        config:
          $ref: '#/components/schemas/AmazonAdsConnectorConfig'
    ShopifyConnectorConfig:
      type: object
      additionalProperties: false
      required: [shop_domain, api_version, credential_ref]
      properties:
        shop_domain: {type: string, pattern: '^[a-z0-9][a-z0-9-]*\.myshopify\.com$'}
        api_version: {type: string, pattern: '^20\d{2}-\d{2}$'}
        credential_ref: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,127}$', writeOnly: true}
    AmazonSPAPIConnectorConfig:
      type: object
      additionalProperties: false
      required: [region, marketplace_ids, lwa_client_id_ref, lwa_client_secret_ref, lwa_refresh_token_ref]
      properties:
        region: {type: string, enum: [na, eu, fe]}
        marketplace_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string, pattern: '^[A-Z0-9]{5,20}$'}
        lwa_client_id_ref: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,127}$', writeOnly: true}
        lwa_client_secret_ref: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,127}$', writeOnly: true}
        lwa_refresh_token_ref: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,127}$', writeOnly: true}
    AmazonAdsConnectorConfig:
      type: object
      additionalProperties: false
      required: [region, profile_id, lwa_client_id_ref, lwa_client_secret_ref, lwa_refresh_token_ref]
      properties:
        region: {type: string, enum: [na, eu, fe]}
        profile_id: {type: string, pattern: '^[0-9]{1,32}$'}
        lwa_client_id_ref: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,127}$', writeOnly: true}
        lwa_client_secret_ref: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,127}$', writeOnly: true}
        lwa_refresh_token_ref: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,127}$', writeOnly: true}
    ConnectorProviderDetails:
      oneOf:
        - {$ref: '#/components/schemas/ShopifyProviderDetails'}
        - {$ref: '#/components/schemas/AmazonSPAPIProviderDetails'}
        - {$ref: '#/components/schemas/AmazonAdsProviderDetails'}
    ShopifyProviderDetails:
      type: object
      additionalProperties: false
      required: [shop_domain, api_version]
      properties:
        shop_domain: {type: string, pattern: '^[a-z0-9][a-z0-9-]*\.myshopify\.com$'}
        api_version: {type: string, pattern: '^20\d{2}-\d{2}$'}
    AmazonSPAPIProviderDetails:
      type: object
      additionalProperties: false
      required: [region, marketplace_ids]
      properties:
        region: {type: string, enum: [na, eu, fe]}
        marketplace_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string, pattern: '^[A-Z0-9]{5,20}$'}
    AmazonAdsProviderDetails:
      type: object
      additionalProperties: false
      required: [region, profile_id]
      properties:
        region: {type: string, enum: [na, eu, fe]}
        profile_id: {type: string, pattern: '^[0-9]{1,32}$'}
    MarketplaceAccount:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - provider
        - external_account_id
        - provider_details
        - credential_refs
        - health_status
        - health_checked_at
        - health_error_code
        - health_error_message
        - created_at
        - updated_at
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        provider: {$ref: '#/components/schemas/ConnectorProvider'}
        external_account_id: {type: string}
        provider_details: {$ref: '#/components/schemas/ConnectorProviderDetails'}
        credential_refs:
          type: object
          description: Credential reference presence only; values are always present and never contain names or secrets.
          minProperties: 1
          additionalProperties: {type: string, enum: [present]}
        health_status:
          type: string
          enum: [unchecked, healthy, unhealthy, misconfigured]
        health_checked_at: {type: string, format: date-time, nullable: true}
        health_error_code:
          type: string
          nullable: true
          enum: [missing_credential, invalid_configuration, external_service_error, null]
        health_error_message: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ConnectorProviderCatalogEntry:
      type: object
      additionalProperties: false
      required: [id, name, detail_fields, credential_fields]
      properties:
        id: {$ref: '#/components/schemas/ConnectorProvider'}
        name: {type: string}
        detail_fields:
          type: array
          items: {type: string}
        credential_fields:
          type: array
          items: {type: string}
    AmazonMarketplaceCatalogEntry:
      type: object
      additionalProperties: false
      required: [id, name, country_code, region]
      properties:
        id: {type: string, pattern: '^[A-Z0-9]{5,20}$'}
        name: {type: string}
        country_code: {type: string, pattern: '^[A-Z]{2}$'}
        region: {type: string, enum: [na, eu, fe]}
    ReportRecipeKey:
      type: string
      enum:
        - sales_traffic_daily
        - fba_inventory_daily
        - listings_daily
        - returns_daily
    ReportRecipeAmazonReportType:
      type: string
      enum:
        - GET_SALES_AND_TRAFFIC_REPORT
        - GET_FBA_MYI_UNSUPPRESSED_INVENTORY_DATA
        - GET_MERCHANT_LISTINGS_ALL_DATA
        - GET_FBA_FULFILLMENT_CUSTOMER_RETURNS_DATA
    ReportRecipeEvidenceReportType:
      type: string
      enum:
        - amazon_business_report
        - amazon_fba_inventory
        - amazon_listing
        - amazon_returns
    ReportRecipeCreate:
      type: object
      additionalProperties: false
      required:
        - connector_account_id
        - name
        - recipe_key
        - marketplace_ids
