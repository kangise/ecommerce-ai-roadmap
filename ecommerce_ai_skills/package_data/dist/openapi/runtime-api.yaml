    AgentRunRequest:
      type: object
      additionalProperties: false
      required: [workflow, objective]
      anyOf:
        - required: [evidence]
        - required: [evidence_import_ids]
        - required: [metric_observation_ids]
      properties:
        workflow: {type: string, enum: [weekly_ops]}
        objective: {type: string, minLength: 5, maxLength: 1000}
        evidence:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/EvidenceSource'}
        evidence_import_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {type: string, format: uuid}
        graph_version_id: {type: string, format: uuid}
        metric_observation_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {type: string, format: uuid}
    EvidenceImport:
      type: object
      required: [id, tenant_id, idempotency_key, platform, report_type, filename, observed_at, sha256, delimiter, row_count, blank_rows_skipped, formula_cells, columns, column_mapping, media_type, byte_size, object_key, sheet_name, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        idempotency_key: {type: string}
        platform: {$ref: '#/components/schemas/MarketplaceId'}
        report_type: {$ref: '#/components/schemas/EvidenceReportType'}
        filename: {type: string}
        observed_at: {type: string, format: date-time}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        delimiter: {type: string}
        row_count: {type: integer, minimum: 1, maximum: 5000}
        blank_rows_skipped: {type: integer, minimum: 0}
        formula_cells: {type: integer, minimum: 0}
        columns: {type: array, minItems: 2, maxItems: 200, items: {type: string}}
        column_mapping:
          type: object
          additionalProperties: {type: string}
        media_type: {type: string, nullable: true}
        byte_size: {type: integer, minimum: 1, nullable: true}
        object_key: {type: string, nullable: true}
        sheet_name: {type: string, nullable: true}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    MetricObservation:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - materialization_id
        - evidence_import_id
        - platform
        - metric_key
        - value_decimal
        - unit
        - currency
        - period_start
        - period_end
        - time_grain
        - dimensions
        - provenance
        - quality
        - created_at
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        materialization_id: {type: string, format: uuid}
        evidence_import_id: {type: string, format: uuid}
        platform: {$ref: '#/components/schemas/MarketplaceId'}
        metric_key: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,79}$'}
        value_decimal:
          type: string
          maxLength: 40
          pattern: '^-?(?:0|[1-9][0-9]{0,28})(?:\.[0-9]{1,9})?$'
          description: Exact finite base-10 value serialized as a string; at most 38 significant digits and scale 9. NaN, infinity, exponent notation, and overflow are rejected.
        unit: {type: string, enum: [count, currency, ratio]}
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          enum: [AED, AUD, BRL, CAD, EGP, EUR, GBP, INR, JPY, MXN, PLN, SAR, SEK, SGD, TRY, USD]
          nullable: true
          description: Required for unit=currency and null for non-monetary observations. Missing monetary currency is quarantined instead of inferred.
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        time_grain:
          type: string
          enum: [snapshot, day, range]
          description: snapshot is a point-in-time balance, day is one calendar day, and range uses the explicit period_start/period_end interval.
        dimensions:
          type: object
          additionalProperties: {type: string, maxLength: 200}
          maxProperties: 20
        provenance:
          type: object
          additionalProperties: false
          required: [source_sha256, source_row, source_field, mapping_version]
          properties:
            source_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            source_row: {type: integer, minimum: 1, maximum: 5000}
            source_field: {type: string, minLength: 1, maxLength: 200}
            mapping_version: {type: string, minLength: 1, maxLength: 40}
        quality:
          type: object
          additionalProperties: false
          required: [status, flags]
          properties:
            status: {type: string, enum: [accepted]}
            flags:
              type: array
              uniqueItems: true
              maxItems: 20
              items: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,79}$'}
        created_at: {type: string, format: date-time}
    MetricMaterialization:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - evidence_import_id
        - idempotency_key
        - status
        - observation_count
        - quarantine_count
        - currencies
        - quality_summary
        - error_code
        - error_message
        - created_by
        - created_at
        - updated_at
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        evidence_import_id: {type: string, format: uuid}
        idempotency_key: {type: string, minLength: 1, maxLength: 200}
        status: {type: string, enum: [running, succeeded, partial, quarantined, failed]}
        observation_count: {type: integer, minimum: 0}
        quarantine_count: {type: integer, minimum: 0}
        currencies:
          type: array
          uniqueItems: true
          items: {type: string, pattern: '^[A-Z]{3}$'}
          description: Explicit currencies present in accepted observations; values are never combined across entries.
        quality_summary:
          type: object
          additionalProperties: false
          required: [accepted, quarantined, flags]
          properties:
            accepted: {type: integer, minimum: 0}
            quarantined: {type: integer, minimum: 0}
            flags:
              type: array
              uniqueItems: true
              maxItems: 50
              items: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,79}$'}
        error_code: {type: string, maxLength: 80, nullable: true}
        error_message: {type: string, maxLength: 1000, nullable: true}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MetricBackfillRequest:
      type: object
