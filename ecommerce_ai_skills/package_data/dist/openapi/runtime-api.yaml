        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/proposal-executions/{executionId}:
    get:
      summary: Read one tenant-owned proposal execution
      parameters:
        - {$ref: '#/components/parameters/executionId'}
      responses:
        '200':
          description: Proposal execution detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProposalExecution'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/evidence-imports:
    get:
      summary: List tenant-owned CSV evidence imports
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Import metadata without stored rows
          content:
            application/json:
              schema:
                type: object
                required: [imports]
                properties:
                  imports:
                    type: array
                    items: {$ref: '#/components/schemas/EvidenceImport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Parse and persist real marketplace CSV evidence
      description: Amazon typed reports receive semantic column validation; platform_generic accepts any ontology marketplace.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, maxLength: 200}
        - in: header
          name: X-Evidence-Platform
          required: true
          schema: {$ref: '#/components/schemas/MarketplaceId'}
        - in: header
          name: X-Evidence-Type
          required: true
          schema: {$ref: '#/components/schemas/EvidenceReportType'}
        - in: header
          name: X-Evidence-Filename
          required: true
          schema: {type: string, maxLength: 200}
        - in: header
          name: X-Evidence-Observed-At
          required: true
          schema: {type: string, format: date-time}
        - in: header
          name: X-Evidence-Sheet
          required: false
          description: Optional worksheet name for XLSX; defaults to the active sheet.
          schema: {type: string}
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, format: binary}
          text/tab-separated-values:
            schema: {type: string, format: binary}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Persisted evidence-import metadata; parsed rows remain server-side
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceImport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/evidence-imports/{importId}:
    get:
      summary: Read tenant-owned evidence-import metadata
      parameters:
        - {$ref: '#/components/parameters/importId'}
      responses:
        '200':
          description: Evidence-import metadata without stored rows
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceImport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/evidence-imports/{importId}/metric-materialization:
    post:
      summary: Materialize durable metric observations from one tenant-owned Evidence import
      description: Requires operator or higher and an Idempotency-Key. The Evidence import is resolved inside the authenticated tenant. Recognized finite decimal values are persisted with period, grain, provenance, and quality metadata. Monetary rows without an explicit ISO 4217 currency are quarantined and never emitted as observations. A failed materialization remains independently inspectable and never rolls back an already successful L3 Evidence import or report sync.
      parameters:
        - {$ref: '#/components/parameters/importId'}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Newly persisted or idempotently replayed materialization
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetricMaterialization'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/metric-observations:
    get:
      summary: List persisted metric observations owned by the authenticated tenant
      description: Viewer access. Results remain currency-isolated; the API does not aggregate or convert monetary observations across currencies.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
        - in: query
          name: cursor
          schema: {type: string, maxLength: 200}
        - in: query
          name: evidence_import_id
          schema: {type: string, format: uuid}
        - in: query
          name: platform
          schema: {$ref: '#/components/schemas/MarketplaceId'}
        - in: query
          name: metric_key
          schema: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,79}$'}
        - in: query
          name: currency
          description: Uppercase ISO 4217 currency code. Omit only when querying non-monetary observations.
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
            enum: [AED, AUD, BRL, CAD, EGP, EUR, GBP, INR, JPY, MXN, PLN, SAR, SEK, SGD, TRY, USD]
      responses:
        '200':
          description: Stable cursor page of tenant-owned observations
          content:
            application/json:
              schema:
                type: object
                required: [observations, next_cursor]
                properties:
                  observations:
                    type: array
                    items: {$ref: '#/components/schemas/MetricObservation'}
                  next_cursor: {type: string, nullable: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/metric-observations/{observationId}:
    get:
      summary: Read one persisted metric observation owned by the authenticated tenant
      parameters:
        - {$ref: '#/components/parameters/observationId'}
      responses:
        '200':
          description: Tenant-owned metric observation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetricObservation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/metric-materializations:
    get:
      summary: List persisted metric materialization attempts owned by the authenticated tenant
      description: Viewer access. Successful, partial, quarantined, and failed attempts remain durable and visible after refresh.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
        - in: query
          name: cursor
          schema: {type: string, maxLength: 200}
        - in: query
          name: evidence_import_id
          schema: {type: string, format: uuid}
        - in: query
          name: status
          schema: {type: string, enum: [running, succeeded, partial, quarantined, failed]}
      responses:
        '200':
          description: Stable cursor page of materialization attempts
          content:
            application/json:
              schema:
                type: object
                required: [materializations, next_cursor]
                properties:
                  materializations:
                    type: array
                    items: {$ref: '#/components/schemas/MetricMaterialization'}
                  next_cursor: {type: string, nullable: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /v1/metric-materializations/backfill:
    post:
      summary: Materialize a bounded page of existing tenant Evidence imports
      description: Requires admin or owner. Backfill is always explicit, bounded to at most 100 imports per call, and cursor-resumable; it never fabricates Evidence or silently scans every tenant import.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MetricBackfillRequest'}
      responses:
        '200':
          description: Persisted materialization results for the processed page
          content:
            application/json:
              schema:
                type: object
                required: [materializations, processed, next_cursor]
                properties:
                  materializations:
                    type: array
                    maxItems: 100
                    items: {$ref: '#/components/schemas/MetricMaterialization'}
                  processed: {type: integer, minimum: 0, maximum: 100}
                  next_cursor: {type: string, nullable: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
