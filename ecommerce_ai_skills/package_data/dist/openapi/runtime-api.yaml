        timezone: {type: string}
        scheduled_for: {type: string, format: date-time}
        status: {type: string, enum: [scheduled, running, completed, empty, failed, blocked]}
        selected_evidence_import_ids:
          type: array
          items: {type: string, format: uuid}
        agent_run_id: {type: string, format: uuid, nullable: true}
        graph_version_id: {type: string, format: uuid}
        graph_version_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        schedule_config: {$ref: '#/components/schemas/DailyOpsScheduleSnapshot'}
        schedule_config_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        selected_metric_observation_ids:
          type: array
          items: {type: string, format: uuid}
        source_gaps:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/DailyOpsSourceGap'}
        brief:
          nullable: true
          allOf: [{$ref: '#/components/schemas/DailyOpsBrief'}]
        error_code: {type: string, nullable: true}
        error_message: {type: string, nullable: true}
        attempt_count: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1, maximum: 20}
        lease_until: {type: string, format: date-time, nullable: true}
        completed_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DailyOpsBriefEnvelope:
      type: object
      additionalProperties: false
      required: [run, brief]
      properties:
        run: {$ref: '#/components/schemas/DailyOpsRun'}
        brief: {$ref: '#/components/schemas/DailyOpsBrief'}
    ScheduleCreate:
      type: object
      additionalProperties: false
      required: [name, objective, interval_minutes, next_run_at]
      anyOf:
        - required: [evidence_import_ids]
        - required: [evidence_selectors]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        objective: {type: string, minLength: 5, maxLength: 1000}
        evidence_import_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        evidence_selectors:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [platform, report_type]
            properties:
              platform: {$ref: '#/components/schemas/MarketplaceId'}
              report_type: {$ref: '#/components/schemas/EvidenceReportType'}
        interval_minutes: {type: integer, minimum: 15, maximum: 43200}
        next_run_at: {type: string, format: date-time}
    Schedule:
      type: object
      required: [id, tenant_id, name, objective, evidence_import_ids, evidence_selectors, interval_minutes, enabled, next_run_at, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        name: {type: string}
        objective: {type: string}
        evidence_import_ids: {type: array, items: {type: string, format: uuid}}
        evidence_selectors:
          type: array
          items:
            type: object
            required: [platform, report_type]
            properties:
              platform: {$ref: '#/components/schemas/MarketplaceId'}
              report_type: {$ref: '#/components/schemas/EvidenceReportType'}
        interval_minutes: {type: integer}
        enabled: {type: boolean}
        next_run_at: {type: string, format: date-time}
        lease_until: {type: string, format: date-time, nullable: true}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_run_at: {type: string, format: date-time, nullable: true}
    MissionControl:
      type: object
      required: [counts, approval_inbox, failed_runs, failed_jobs, recent_runs, schedules]
      properties:
        counts:
          type: object
          additionalProperties: true
        approval_inbox: {type: array, items: {$ref: '#/components/schemas/Action'}}
        failed_runs: {type: array, items: {$ref: '#/components/schemas/AgentRun'}}
        failed_jobs: {type: array, items: {$ref: '#/components/schemas/Job'}}
        recent_runs: {type: array, items: {$ref: '#/components/schemas/AgentRun'}}
        schedules: {type: array, items: {$ref: '#/components/schemas/Schedule'}}
    OperatingBriefing:
      type: object
      required: [platform, evidence, metrics, latest_run, brief_run_id, executive_summary, priorities, risks, limitations, agents, approvals]
      properties:
        platform:
          type: object
          required: [id, label]
          properties:
            id: {$ref: '#/components/schemas/MarketplaceId'}
            label: {type: object, additionalProperties: {type: string}}
        evidence:
          type: object
          required: [source_count, row_count, latest_observed_at, report_types]
          properties:
            source_count: {type: integer, minimum: 0}
            row_count: {type: integer, minimum: 0}
            latest_observed_at: {type: string, format: date-time, nullable: true}
            report_types: {type: array, items: {$ref: '#/components/schemas/EvidenceReportType'}}
        metrics:
          type: array
          items: {$ref: '#/components/schemas/BriefingMetric'}
        latest_run:
          nullable: true
          allOf: [{$ref: '#/components/schemas/AgentRun'}]
        brief_run_id: {type: string, format: uuid, nullable: true}
        executive_summary: {type: string, nullable: true}
        priorities: {type: array, items: {type: object, additionalProperties: true}}
        risks: {type: array, items: {type: object, additionalProperties: true}}
        limitations: {type: array, items: {type: string}}
        agents: {type: array, items: {$ref: '#/components/schemas/BriefingAgent'}}
        approvals: {type: array, items: {$ref: '#/components/schemas/Action'}}
    BriefingMetric:
      type: object
      required: [key, series_id, label, format, trend_mode, value, currency, unit, time_grain, dimensions, change_percent, observed_at, source_import_id, series]
      properties:
        key: {type: string}
        series_id: {type: string, pattern: '^[a-f0-9]{24}$'}
        label: {type: string}
        format: {type: string, enum: [amount, integer, percent]}
        trend_mode: {type: string, enum: [higher_is_better, higher_is_risk, context_only]}
        value: {type: number}
        currency: {type: string, nullable: true}
        unit: {type: string, enum: [count, currency, ratio]}
        time_grain: {type: string, enum: [snapshot, day, range]}
        dimensions: {type: object, additionalProperties: {type: string}}
        change_percent: {type: number, nullable: true}
        observed_at: {type: string, format: date-time}
        source_import_id: {type: string, format: uuid}
        series:
          type: array
          maxItems: 7
          items:
            type: object
            required: [observed_at, period_start, period_end, value, source_import_id, dimensions]
            properties:
              observed_at: {type: string, format: date-time}
              period_start: {type: string, format: date-time}
              period_end: {type: string, format: date-time}
              value: {type: number}
              source_import_id: {type: string, format: uuid}
              dimensions: {type: object, additionalProperties: {type: string}}
    BriefingAgent:
      type: object
      required: [id, name, status, updated_at, skill_ids]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [pending, running, completed, failed]}
        updated_at: {type: string, format: date-time}
        skill_ids: {type: array, items: {type: string}}
    RuntimeCatalog:
      type: object
      required: [platforms, report_types, workflows, action_operations, connector_providers, amazon_marketplaces, report_recipe_types, metric_materialization_report_types]
      properties:
        platforms:
          type: array
          items:
            type: object
            required: [id, label]
            additionalProperties: true
            properties:
              id: {$ref: '#/components/schemas/MarketplaceId'}
              label: {type: object, additionalProperties: {type: string}}
        report_types:
          type: array
          items: {$ref: '#/components/schemas/EvidenceReportType'}
        workflows: {type: array, items: {type: string, enum: [weekly_ops]}}
        action_operations:
          type: array
          items: {type: string, enum: [shopify.sync_products, amazon_spapi.import_report]}
        connector_providers:
          type: array
          items: {$ref: '#/components/schemas/ConnectorProviderCatalogEntry'}
        amazon_marketplaces:
          type: array
          items: {$ref: '#/components/schemas/AmazonMarketplaceCatalogEntry'}
        report_recipe_types:
          type: array
          items: {$ref: '#/components/schemas/ReportRecipeCatalogEntry'}
        metric_materialization_report_types:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/EvidenceReportType'}
    AuditEvent:
      type: object
      required: [id, tenant_id, request_id, action, resource_type, outcome, metadata, created_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        actor_user_id: {type: string, format: uuid, nullable: true}
        request_id: {type: string}
        action: {type: string}
        resource_type: {type: string}
        resource_id: {type: string, nullable: true}
        outcome: {type: string}
        metadata: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
    ConnectorRecord:
      type: object
      required: [id, tenant_id, provider, external_id, payload, synced_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        provider: {type: string}
        external_id: {type: string}
        payload: {type: object, additionalProperties: true}
        synced_at: {type: string, format: date-time}
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type: {type: string}
            message: {type: string}
        request_id: {type: string}
